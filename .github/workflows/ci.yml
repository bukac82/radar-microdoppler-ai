name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install optional ML dependencies
        run: |
          pip install scikit-learn xgboost || true

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select E,F,W --ignore E501

  notebooks:
    name: Validate Notebooks (nbformat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nbformat
      - name: Check all notebooks are valid JSON
        run: |
          python -c "
          import nbformat, pathlib, sys
          errors = []
          for nb_path in pathlib.Path('notebooks').glob('*.ipynb'):
              try:
                  nb = nbformat.read(str(nb_path), as_version=4)
                  nbformat.validate(nb)
                  print(f'  OK: {nb_path.name}')
              except Exception as e:
                  errors.append(f'{nb_path.name}: {e}')
          if errors:
              print('ERRORS:', errors); sys.exit(1)
          "
