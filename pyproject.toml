[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "radar-microdoppler-ai"
version = "1.0.0"
description = "End-to-end AI pipeline for helicopter micro-Doppler signature classification: Classical ML, Quantum ML, Deep Learning, Robustness Testing, and Open-Set Recognition."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vikas Agnihotri" }]
keywords = [
    "radar", "micro-doppler", "helicopter", "classification",
    "quantum-machine-learning", "deep-learning", "signal-processing",
    "open-set-recognition", "explainability"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dl = ["torch>=2.0", "torchvision>=0.15"]
qml = ["pennylane>=0.36", "pennylane-lightning>=0.36"]
explain = ["shap>=0.44"]
xgb = ["xgboost>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "nbformat>=5.9",
]
all = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pennylane>=0.36",
    "pennylane-lightning>=0.36",
    "shap>=0.44",
    "xgboost>=2.0",
]

[project.urls]
Homepage = "https://github.com/bukac82/radar-microdoppler-ai"
Repository = "https://github.com/bukac82/radar-microdoppler-ai"
"Bug Tracker" = "https://github.com/bukac82/radar-microdoppler-ai/issues"
Documentation = "https://github.com/bukac82/radar-microdoppler-ai#readme"

[tool.setuptools.packages.find]
include = [
    "Dataset*", "Preprocessing*", "Classical_ML*", "Quantum_ML*",
    "Deep_Learning*", "Robustness_Testing*", "Open_Set_Recognition*",
    "Explainability*", "Evaluation*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
